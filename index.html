<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3D Smart City Simulator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

</head>


<body>

    <!-- 3D CITY -->

    <div id="city-container"></div>


    <!-- SMART CITY DASHBOARD -->

    <div id="dashboard" class="hud-panel is-go">

        <div class="dashboard-title">
            Smart City
        </div>

        <div class="dashboard-subtitle">
            Live traffic operations
        </div>


        <div class="stat-row">

            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/>
                <path d="M3 13h18v4a1 1 0 0 1-1 1h-1.5a1 1 0 0 1-1-1v-1H6.5v1a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/>
                <circle cx="7" cy="17" r="1.4"/>
                <circle cx="17" cy="17" r="1.4"/>
            </svg>

            <div class="stat-text">
                <div class="stat-label">Vehicles</div>
                <div class="stat-value" id="vehicle-count">12</div>
            </div>

        </div>


        <div class="stat-row">

            <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                <circle cx="6" cy="6" r="2"/>
                <circle cx="12" cy="6" r="2"/>
                <circle cx="18" cy="6" r="2"/>
                <circle cx="6" cy="12" r="2"/>
                <circle cx="12" cy="12" r="2"/>
                <circle cx="18" cy="12" r="2"/>
                <circle cx="6" cy="18" r="2"/>
                <circle cx="12" cy="18" r="2"/>
                <circle cx="18" cy="18" r="2"/>
            </svg>

            <div class="stat-text">
                <div class="stat-label">Traffic density</div>
                <div class="stat-value" id="traffic-density">0%</div>
            </div>

        </div>


        <div class="stat-row">

            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 15a8 8 0 1 1 16 0"/>
                <path d="M12 15l4-5"/>
                <circle cx="12" cy="15" r="1.2" fill="currentColor" stroke="none"/>
            </svg>

            <div class="stat-text">
                <div class="stat-label">Avg. speed</div>
                <div class="stat-value" id="average-speed">50 km/h</div>
            </div>

        </div>


        <div class="stat-row">

            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="8" y="3" width="8" height="18" rx="3"/>
                <circle cx="12" cy="7.5" r="1.3" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>
                <circle cx="12" cy="16.5" r="1.3" fill="currentColor" stroke="none"/>
            </svg>

            <div class="stat-text">
                <div class="stat-label">Signal</div>
                <div class="stat-value is-go" id="signal-status">GREEN</div>
            </div>

        </div>


        <div class="stat-row">

            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="13" r="7.5"/>
                <path d="M12 13V9"/>
                <path d="M9.5 3h5"/>
            </svg>

            <div class="stat-text">
                <div class="stat-label">Next change</div>
                <div class="stat-value" id="signal-timer">6s</div>
            </div>

        </div>


        <!-- DAY NIGHT BUTTON -->

        <button
            id="day-night-button"
            class="day-night-btn"
        >
            🌙 Switch to Night
        </button>


        <div class="system-status">

            <span class="pulse-dot"></span>

            System online

        </div>

    </div>


    <script
        type="module"
        src="./main.js"
    ></script>

</body>

</html>
